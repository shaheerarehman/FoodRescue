name: FoodRescue CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q .

      - name: Run automated tests
        run: |
          pytest -v

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ca-central-1

      - name: Create deployment package
        run: |
          zip -r foodrescue.zip . \
            -x ".git/*" \
            -x ".github/*" \
            -x ".venv/*" \
            -x ".env" \
            -x "__pycache__/*" \
            -x ".pytest_cache/*" \
            -x "foodrescue.zip"

      - name: Upload deployment package
        run: |
          aws s3 cp foodrescue.zip s3://foodrescue-deployments-shaheer-2026/latest.zip

      - name: Deploy through Auto Scaling
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name FoodRescue-ASG \
            --preferences '{"MinHealthyPercentage":0,"InstanceWarmup":120}'